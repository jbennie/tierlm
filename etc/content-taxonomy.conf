# content-taxonomy.conf -- content types offered by tierlm-setup's
# "Experts and content" section and used by tlmc for calibration labelling.
# Installed as /etc/tierlm/content-taxonomy.conf; edit that copy to add types.
#
# Format: <type> = <description>
#   - a type is a lowercase dotted name; <parent>.<child> is a child type,
#     and a child inherits its parent's depth unless it is set itself
#   - every type becomes the key content.<type> in tierlm.conf, set to
#     exclude | shallow | standard | deep; content.default covers the rest
#   - descriptions say what a type covers: typed decision models follow the
#     label more than its definition, so keep labels meaningful

code                    = Programming and source code
code.python             = Python
code.c_cpp              = C and C++
code.rust               = Rust
code.go                 = Go
code.js_ts              = JavaScript and TypeScript
code.java               = Java and other JVM languages
code.sql                = SQL and database queries
code.shell              = Shell scripts and command lines
code.other              = Other programming languages

math                    = Mathematics
science                 = Natural sciences
engineering             = Engineering

law                     = Law and legal text
medicine                = Medicine and health
finance                 = Finance and accounting

lang                    = Natural languages
lang.en                 = English
lang.zh                 = Chinese
lang.ja                 = Japanese
lang.ko                 = Korean
lang.de                 = German
lang.fr                 = French
lang.es                 = Spanish
lang.other              = Other natural languages

creative                = Creative writing
chat                    = Conversation and chit-chat

tools                   = Tool use and structured output
tools.json              = JSON and other structured output
tools.function_calling  = Function and tool calling
tools.agentic_traces    = Multi-step agentic traces

reasoning               = Long chain-of-thought reasoning
